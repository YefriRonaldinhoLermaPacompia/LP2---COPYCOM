<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="hstack align-items-center">
      <div class="rounded icon-48 bg-light-error d-flex align-items-center flex-shrink-0 justify-content-center">
        <i class="iconify f-s-24 text-error" data-icon="solar:printer-2-line-duotone"></i>
      </div>
      <mat-card-title class="f-s-16 f-w-500 m-b-0">Ingresos Totales</mat-card-title>
    </div>

    <div class="row m-t-8">
      <div class="col-6">
        <h5 class="f-s-24 f-w-500 m-b-8 m-t-30">S/ 12,450</h5>
        <span class="text-success f-s-14 f-w-600">+15%</span>
      </div>
      <div class="col-6">
        <!-- chart -->
        <apx-chart [series]="totalincomeChart.series" [chart]="totalincomeChart.chart"
          [stroke]="totalincomeChart.stroke" [markers]="totalincomeChart.markers"
          [tooltip]="totalincomeChart.tooltip"></apx-chart>
      </div>
    </div>
  </mat-card-content>
</mat-card>

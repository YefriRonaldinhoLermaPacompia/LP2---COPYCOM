<div class="dialog-container">
  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Tipo de Maquinaria' : 'Nuevo Tipo de Maquinaria' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="tipoForm" class="tipo-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre del Tipo</mat-label>
        <input matInput formControlName="nombreTipoMaquinaria" placeholder="Ej: Impresora, Copiadora" maxlength="45" />
        <mat-icon matPrefix>category</mat-icon>
        <mat-error *ngIf="hasError('nombreTipoMaquinaria', 'required')">El nombre es requerido.</mat-error>
        <mat-error *ngIf="hasError('nombreTipoMaquinaria', 'maxlength')">Máximo 45 caracteres.</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">
      <mat-icon class="m-r-8">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</div>

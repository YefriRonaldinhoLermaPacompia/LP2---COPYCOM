<mat-card class="cardWithShadow">
  <mat-card-content>
    <mat-tab-group>
      <!-- TAB: TIPOS DE MAQUINARIA -->
      <mat-tab label="Tipos de Maquinaria">
        <div class="d-flex justify-content-between align-items-center m-t-20 m-b-20">
          <h3>Tipos de Maquinaria</h3>
          <button mat-raised-button color="primary" (click)="openCreateTipoDialog()">
            <mat-icon>add</mat-icon>
            Nuevo Tipo
          </button>
        </div>

        <div *ngIf="isLoadingTipos" class="text-center p-y-40">
          <mat-spinner diameter="40" class="m-auto"></mat-spinner>
        </div>

        <div *ngIf="!isLoadingTipos" class="table-responsive">
          <table mat-table [dataSource]="tiposMaquinaria" class="w-100">
            <ng-container matColumnDef="nombreTipoMaquinaria">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Nombre del Tipo</th>
              <td mat-cell *matCellDef="let tipo">
                <h6 class="f-s-15 f-w-600 text-dark m-0">{{ tipo.nombreTipoMaquinaria }}</h6>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
              <td mat-cell *matCellDef="let tipo">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menú de acciones">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openEditTipoDialog(tipo)">
                    <mat-icon class="text-primary">edit</mat-icon>
                    <span>Editar</span>
                  </button>
                  <button mat-menu-item (click)="deleteTipoMaquinaria(tipo)">
                    <mat-icon class="text-error">delete</mat-icon>
                    <span>Eliminar</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumnsTipos"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumnsTipos" class="hover-row"></tr>
          </table>
        </div>
      </mat-tab>

      <!-- TAB: MÁQUINAS -->
      <mat-tab label="Máquinas">
        <div class="d-flex justify-content-between align-items-center m-t-20 m-b-20">
          <h3>Máquinas</h3>
          <button mat-raised-button color="primary" (click)="openCreateMaquinaDialog()">
            <mat-icon>add</mat-icon>
            Nueva Máquina
          </button>
        </div>

        <div *ngIf="isLoadingMaquinas" class="text-center p-y-40">
          <mat-spinner diameter="40" class="m-auto"></mat-spinner>
        </div>

        <div *ngIf="!isLoadingMaquinas" class="table-responsive">
          <table mat-table [dataSource]="maquinas" class="w-100">
            <ng-container matColumnDef="nombreMaquina">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Nombre</th>
              <td mat-cell *matCellDef="let maquina">
                <h6 class="f-s-15 f-w-600 text-dark m-0">{{ maquina.nombreMaquina }}</h6>
              </td>
            </ng-container>

            <ng-container matColumnDef="tipoMaquinaria">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Tipo</th>
              <td mat-cell *matCellDef="let maquina">
                <span class="f-s-14 text-muted">{{ getNombreTipo(maquina.tipoMaquinariaId) }}</span>
              </td>
            </ng-container>

            <ng-container matColumnDef="fechaUltMantenimiento">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Último Mantenimiento</th>
              <td mat-cell *matCellDef="let maquina">
                <span class="f-s-14 text-muted">
                  {{ maquina.fechaUltMantenimiento ? (maquina.fechaUltMantenimiento | date:'short') : 'N/A' }}
                </span>
              </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
              <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
              <td mat-cell *matCellDef="let maquina">
                <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menú de acciones">
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openEditMaquinaDialog(maquina)">
                    <mat-icon class="text-primary">edit</mat-icon>
                    <span>Editar</span>
                  </button>
                  <button mat-menu-item (click)="deleteMaquina(maquina)">
                    <mat-icon class="text-error">delete</mat-icon>
                    <span>Eliminar</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumnsMaquinas"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumnsMaquinas" class="hover-row"></tr>
          </table>
        </div>
      </mat-tab>
    </mat-tab-group>
  </mat-card-content>
</mat-card>

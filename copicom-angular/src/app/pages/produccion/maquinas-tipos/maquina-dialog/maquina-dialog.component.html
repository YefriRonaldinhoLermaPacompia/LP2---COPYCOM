<div class="dialog-container">
  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Máquina' : 'Nueva Máquina' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="maquinaForm" class="maquina-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre de la Máquina</mat-label>
        <input matInput formControlName="nombreMaquina" placeholder="Ej: Impresora HP LaserJet" maxlength="45" />
        <mat-icon matPrefix>print</mat-icon>
        <mat-error *ngIf="hasError('nombreMaquina', 'required')">El nombre es requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Tipo de Maquinaria</mat-label>
        <mat-select formControlName="tipoMaquinariaId">
          <mat-option *ngFor="let tipo of tiposMaquinaria" [value]="tipo.id">
            {{ tipo.nombreTipoMaquinaria }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix>category</mat-icon>
        <mat-error *ngIf="hasError('tipoMaquinariaId', 'required')">El tipo es requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="3" placeholder="Descripción de la máquina" maxlength="255"></textarea>
        <mat-icon matPrefix>description</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha de Último Mantenimiento</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fechaUltMantenimiento" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-icon matPrefix>calendar_today</mat-icon>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">
      <mat-icon class="m-r-8">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</div>

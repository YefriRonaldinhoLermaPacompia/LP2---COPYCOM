<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center m-b-20">
      <mat-card-title class="m-0">Gestión de Pagos</mat-card-title>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Pago
      </button>
    </div>

    <div *ngIf="isLoading" class="text-center p-y-40">
      <mat-spinner diameter="40" class="m-auto"></mat-spinner>
      <p class="m-t-16 text-muted">Cargando pagos...</p>
    </div>

    <div *ngIf="!isLoading" class="table-responsive">
      <table mat-table [dataSource]="pagos" class="w-100">
        <ng-container matColumnDef="modo">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Modo de Pago</th>
          <td mat-cell *matCellDef="let pago">
            <span class="badge bg-primary">{{ pago.modo || 'N/A' }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="monto">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Monto</th>
          <td mat-cell *matCellDef="let pago">
            <span class="f-s-14 f-w-600 text-dark">
              {{ pago.monto | currency:'PEN':'symbol':'1.2-2' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="fechaPago">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Fecha</th>
          <td mat-cell *matCellDef="let pago">
            {{ pago.fechaPago ? (pago.fechaPago | date:'short') : 'N/A' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="ventaId">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Venta ID</th>
          <td mat-cell *matCellDef="let pago">#{{ pago.ventaId }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
          <td mat-cell *matCellDef="let pago">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menú de acciones">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditDialog(pago)">
                <mat-icon class="text-primary">edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="deletePago(pago)">
                <mat-icon class="text-error">delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover-row"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center p-y-40" [attr.colspan]="displayedColumns.length">
            <mat-icon class="f-s-48 text-muted m-b-16">payment</mat-icon>
            <p class="f-s-16 text-muted m-0">No se encontraron pagos</p>
            <button mat-raised-button color="primary" class="m-t-16" (click)="openCreateDialog()">
              <mat-icon>add</mat-icon>
              Crear Primer Pago
            </button>
          </td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>

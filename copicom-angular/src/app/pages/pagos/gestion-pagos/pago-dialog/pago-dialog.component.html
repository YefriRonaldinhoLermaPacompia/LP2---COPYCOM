<div class="dialog-container">
  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Pago' : 'Nuevo Pago' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="pagoForm" class="pago-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Modo de Pago</mat-label>
        <mat-select formControlName="modo">
          <mat-option *ngFor="let modo of modosPago" [value]="modo">
            {{ modo }}
          </mat-option>
        </mat-select>
        <mat-icon matPrefix>payment</mat-icon>
        <mat-error *ngIf="hasError('modo', 'required')">El modo de pago es requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Monto</mat-label>
        <input matInput type="number" formControlName="monto" placeholder="0.00" step="0.01" min="0.01" />
        <mat-icon matPrefix>attach_money</mat-icon>
        <mat-error *ngIf="hasError('monto', 'required')">El monto es requerido.</mat-error>
        <mat-error *ngIf="hasError('monto', 'min')">El monto debe ser mayor a 0.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>ID de Venta</mat-label>
        <input matInput type="number" formControlName="ventaId" placeholder="Ingrese ID de venta" />
        <mat-icon matPrefix>receipt</mat-icon>
        <mat-error *ngIf="hasError('ventaId', 'required')">El ID de venta es requerido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Fecha de Pago</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="fechaPago" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-icon matPrefix>calendar_today</mat-icon>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">
      <mat-icon class="m-r-8">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</div>

<div class="dialog-container">
  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Tamaño' : 'Nuevo Tamaño' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="tamanoForm" class="tamano-form">

      <!-- Campo Nombre -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre</mat-label>
        <input
          matInput
          formControlName="nombre"
          placeholder="Ej: Grande"
          maxlength="100" />
        <mat-icon matPrefix>title</mat-icon>

        <mat-error *ngIf="hasError('nombre', 'required')">
          El nombre es requerido
        </mat-error>

        <mat-error *ngIf="hasError('nombre', 'maxlength')">
          Máximo 100 caracteres
        </mat-error>
      </mat-form-field>

      <!-- Campo Precio -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Precio</mat-label>
        <input
          matInput
          formControlName="precio"
          type="number"
          step="0.01"
          min="0"
          placeholder="Ej: 12.50" />
        <mat-icon matPrefix>attach_money</mat-icon>

        <mat-error *ngIf="hasError('precio', 'required')">
          El precio es requerido
        </mat-error>

        <mat-error *ngIf="hasError('precio', 'min')">
          El precio no puede ser negativo
        </mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button (click)="onCancel()" type="button">
      Cancelar
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      type="submit">
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</div>

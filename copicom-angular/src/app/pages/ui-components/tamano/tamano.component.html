<mat-card class="cardWithShadow">
  <mat-card-content>
    <!-- Header con título y botón -->
    <div class="d-flex justify-content-between align-items-center m-b-20">
      <mat-card-title class="m-0">Gestión de Tamaños</mat-card-title>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Tamaño
      </button>
    </div>

    <!-- Indicador de carga -->
    <div *ngIf="isLoading" class="text-center p-y-40">
      <mat-spinner diameter="40" class="m-auto"></mat-spinner>
      <p class="m-t-16 text-muted">Cargando tamaños...</p>
    </div>

    <!-- Tabla de categorías -->
    <div *ngIf="!isLoading" class="table-responsive">
      <table mat-table [dataSource]="tamanos" class="w-100">

        <!-- Columna Nombre -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">
            Nombre
          </th>
          <td mat-cell *matCellDef="let tamano">
            <h6 class="f-s-15 f-w-600 text-dark m-0">
              {{ tamano.nombreTamano }}
            </h6>
          </td>
        </ng-container>

        <!-- Columna Descripción -->
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">
            Precio
          </th>
          <td mat-cell *matCellDef="let tamano">
            <span class="f-s-14 text-muted">
              {{ tamano.precioTamano | currency:'PEN':'symbol':'1.2-2' }}
            </span>
          </td>
        </ng-container>

        <!-- Columna Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
          <td mat-cell *matCellDef="let tamano">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menú de acciones">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditDialog(tamano)">
                <mat-icon class="text-primary">edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="deleteTamano(tamano)">
                <mat-icon class="text-error">delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <!-- Headers y Rows -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover-row"></tr>

        <!-- Mensaje cuando no hay datos -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center p-y-40" [attr.colspan]="displayedColumns.length">
            <mat-icon class="f-s-48 text-muted m-b-16">inventory_2</mat-icon>
            <p class="f-s-16 text-muted m-0">No se encontraron tamaños</p>
            <button mat-raised-button color="primary" class="m-t-16" (click)="openCreateDialog()">
              <mat-icon>add</mat-icon>
              Crear Primer Tamaño
            </button>
          </td>
        </tr>
      </table>
    </div>

  </mat-card-content>
</mat-card>

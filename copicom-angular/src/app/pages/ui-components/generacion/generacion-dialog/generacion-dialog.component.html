<div class="dialog-container">

  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Tipo de Generación' : 'Nuevo Tipo de Generación' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="tipoForm" class="tipo-form">

      <!-- Campo Nombre Tipo Generación -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombre del Tipo de Generación</mat-label>
        <input
          matInput
          formControlName="nombreTipoGeneracion"
          placeholder="Ej: Automática, Manual, Digital, etc."
          maxlength="120" />
        <mat-icon matPrefix>category</mat-icon>

        <mat-error *ngIf="hasError('nombreTipoGeneracion', 'required')">
          El nombre es obligatorio
        </mat-error>

        <mat-error *ngIf="hasError('nombreTipoGeneracion', 'maxlength')">
          Máximo 120 caracteres permitidos
        </mat-error>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button (click)="onCancel()" type="button">
      Cancelar
    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      type="submit">
      <mat-icon>{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>

</div>

<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center m-b-20">
      <mat-card-title class="m-0">Generar Cotización</mat-card-title>
    </div>

    <div class="text-center p-y-40">
      <mat-icon class="f-s-64 text-primary m-b-16">description</mat-icon>
      <p class="f-s-18 f-w-600 m-0 m-b-8">Sistema de Cotizaciones</p>
      <p class="f-s-14 text-muted m-0 m-b-24">
        Genera una cotización seleccionando servicios y configurando los detalles del pedido.
      </p>
      <button mat-raised-button color="primary" (click)="generarCotizacion()">
        <mat-icon class="m-r-8">add</mat-icon>
        Generar Nueva Cotización
      </button>
    </div>
  </mat-card-content>
</mat-card>

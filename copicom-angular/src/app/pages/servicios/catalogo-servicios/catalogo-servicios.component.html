<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center m-b-20">
      <mat-card-title class="m-0">Catálogo de Servicios</mat-card-title>
    </div>

    <div *ngIf="isLoading" class="text-center p-y-40">
      <mat-spinner diameter="40" class="m-auto"></mat-spinner>
      <p class="m-t-16 text-muted">Cargando servicios...</p>
    </div>

    <div *ngIf="!isLoading" class="servicios-grid">
      <mat-card *ngFor="let servicio of servicios" class="servicio-card mat-elevation-z2">
        <mat-card-header>
          <mat-card-title>{{ servicio.nombreServicio }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="text-muted">{{ servicio.descripcion || 'Sin descripción' }}</p>
          <div class="precio-box">
            <span class="precio-label">Precio:</span>
            <span class="precio-value">S/ {{ servicio.precioUnitario | number:'1.2-2' }}</span>
          </div>
        </mat-card-content>
      </mat-card>
    </div>

    <div *ngIf="!isLoading && servicios.length === 0" class="text-center p-y-40">
      <mat-icon class="f-s-48 text-muted m-b-16">inventory</mat-icon>
      <p class="f-s-16 text-muted m-0">No hay servicios disponibles</p>
    </div>
  </mat-card-content>
</mat-card>

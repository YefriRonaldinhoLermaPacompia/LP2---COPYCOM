<mat-card class="cardWithShadow">
  <mat-card-content>
    <div class="d-flex justify-content-between align-items-center m-b-20">
      <mat-card-title class="m-0">Registrar Cliente</mat-card-title>
      <button mat-raised-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Cliente
      </button>
    </div>

    <div *ngIf="isLoading" class="text-center p-y-40">
      <mat-spinner diameter="40" class="m-auto"></mat-spinner>
      <p class="m-t-16 text-muted">Cargando clientes...</p>
    </div>

    <div *ngIf="!isLoading" class="table-responsive">
      <table mat-table [dataSource]="clientes" class="w-100">
        <ng-container matColumnDef="nombres">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Nombres</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.nombres || 'N/A' }}</td>
        </ng-container>

        <ng-container matColumnDef="apellidos">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Apellidos</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.apellidos || 'N/A' }}</td>
        </ng-container>

        <ng-container matColumnDef="dni">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">DNI</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.dni || 'N/A' }}</td>
        </ng-container>

        <ng-container matColumnDef="telefono">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Teléfono</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.telefono || 'N/A' }}</td>
        </ng-container>

        <ng-container matColumnDef="correo">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14">Correo</th>
          <td mat-cell *matCellDef="let cliente">{{ cliente.correo || 'N/A' }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="f-w-600 f-s-14"></th>
          <td mat-cell *matCellDef="let cliente">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menú de acciones">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditDialog(cliente)">
                <mat-icon class="text-primary">edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="deleteCliente(cliente)">
                <mat-icon class="text-error">delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover-row"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center p-y-40" [attr.colspan]="displayedColumns.length">
            <mat-icon class="f-s-48 text-muted m-b-16">person_add</mat-icon>
            <p class="f-s-16 text-muted m-0">No se encontraron clientes</p>
            <button mat-raised-button color="primary" class="m-t-16" (click)="openCreateDialog()">
              <mat-icon>add</mat-icon>
              Crear Primer Cliente
            </button>
          </td>
        </tr>
      </table>
    </div>
  </mat-card-content>
</mat-card>

<div class="dialog-container">
  <h2 mat-dialog-title class="d-flex align-items-center">
    <mat-icon class="m-r-8">{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Trabajador' : 'Nuevo Trabajador' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="trabajadorForm" class="trabajador-form">
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Nombres</mat-label>
        <input matInput formControlName="nombres" placeholder="Ingrese nombres completos" maxlength="100" />
        <mat-icon matPrefix>person</mat-icon>
        <mat-error *ngIf="hasError('nombres', 'required')">Los nombres son requeridos.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>DNI</mat-label>
        <input matInput formControlName="dni" placeholder="Ingrese DNI (8 dígitos)" maxlength="8" />
        <mat-icon matPrefix>badge</mat-icon>
        <mat-error *ngIf="hasError('dni', 'required')">El DNI es requerido.</mat-error>
        <mat-error *ngIf="hasError('dni', 'minlength')">El DNI debe tener 8 dígitos.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Celular</mat-label>
        <input matInput formControlName="celular" placeholder="Ingrese celular (opcional)" maxlength="45" />
        <mat-icon matPrefix>phone</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Correo Electrónico</mat-label>
        <input matInput type="email" formControlName="correo" placeholder="Ingrese correo (opcional)" maxlength="100" />
        <mat-icon matPrefix>email</mat-icon>
        <mat-error *ngIf="hasError('correo', 'email')">Correo inválido.</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="p-16">
    <button mat-button type="button" (click)="onCancel()">Cancelar</button>
    <button mat-raised-button color="primary" type="submit" (click)="onSubmit()">
      <mat-icon class="m-r-8">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
      {{ isEditMode ? 'Actualizar' : 'Crear' }}
    </button>
  </mat-dialog-actions>
</div>
